spring.application.name=mi-proyecto

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mi_basededatos
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate Configuration
# Opciones: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL Initialization (ejecutar scripts SQL al iniciar)
spring.sql.init.mode=never
# spring.sql.init.mode=always  # Descomentar para ejecutar scripts SQL

# Server Configuration
#server.port=8080    
#server.servlet.context-path=/api

# Logging Configuration
#logging.level.org.springframework=INFO
#logging.level.com.proyecto.demo=DEBUG
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

